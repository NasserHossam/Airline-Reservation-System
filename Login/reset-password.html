<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AeroBooker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Video Background -->
    <div class="background">
        <video autoplay muted loop playsinline>
            <source src="media/background.mp4.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>

    <div class="container">
        <div class="form-container" id="resetForm">
            <h1>Set a New Password</h1>
            <p class="subtitle" id="subtitleText">Enter your new password below</p>

            <form id="resetPasswordForm">
                <div class="input-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" placeholder="At least 8 characters" required minlength="8">
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" placeholder="Re-enter your new password" required minlength="8">
                </div>

                <p id="statusMessage" style="display: none; margin: 10px 0; font-size: 14px;"></p>

                <button type="submit" class="btn btn-primary" id="submitBtn">Reset Password</button>
            </form>

            <div class="switch-form">
                <p><a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script src="../shared/config.js"></script>
    <script>
        const form = document.getElementById('resetPasswordForm');
        const statusMessage = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        // Pull the reset token out of the URL, e.g.
        // reset-password.html?token=abc123...
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        function showMessage(text, isError) {
            statusMessage.textContent = text;
            statusMessage.style.display = 'block';
            statusMessage.style.color = isError ? '#e53e3e' : '#38a169';
        }

        if (!token) {
            form.style.display = 'none';
            document.getElementById('subtitleText').textContent = '';
            showMessage('This reset link is missing its token. Please request a new one from the login page.', true);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match.', true);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            try {
                const response = await authFetch('/auth/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await response.json();

                if (response.ok) {
                    showMessage(data.message || 'Password reset successfully. Redirecting to login...', false);
                    form.reset();
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    showMessage(data.message || 'This reset link is invalid or has expired.', true);
                }
            } catch (error) {
                console.error('Reset password error:', error);
                showMessage('Something went wrong. Please check your connection and try again.', true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
