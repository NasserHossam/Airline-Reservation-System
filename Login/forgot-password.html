<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AeroBooker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Video Background -->
    <div class="background">
        <video autoplay muted loop playsinline>
            <source src="media/background.mp4.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>

    <div class="container">
        <div class="form-container" id="forgotForm">
            <h1>Forgot Password?</h1>
            <p class="subtitle">Enter your email and we'll send you a reset link</p>

            <form id="forgotPasswordForm">
                <div class="input-group">
                    <label for="forgot-email">Email</label>
                    <input type="email" id="forgot-email" placeholder="Enter your email" required>
                </div>

                <p id="statusMessage" style="display: none; margin: 10px 0; font-size: 14px;"></p>

                <button type="submit" class="btn btn-primary" id="submitBtn">Send Reset Link</button>
            </form>

            <div class="switch-form">
                <p><a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script src="../shared/config.js"></script>
    <script>
        const form = document.getElementById('forgotPasswordForm');
        const statusMessage = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        function showMessage(text, isError) {
            statusMessage.textContent = text;
            statusMessage.style.display = 'block';
            statusMessage.style.color = isError ? '#e53e3e' : '#38a169';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value.trim();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                const response = await authFetch('/auth/forgot-password', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                });
                const data = await response.json();

                // The backend always returns the same generic message whether
                // or not the email exists, by design (prevents account
                // enumeration). We just display whatever it says.
                showMessage(data.message || 'If an account exists for that email, a reset link has been sent.', false);
                form.reset();
            } catch (error) {
                console.error('Forgot password error:', error);
                showMessage('Something went wrong. Please check your connection and try again.', true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
